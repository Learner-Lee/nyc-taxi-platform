networks:
  taxi-net:
    external: true
    name: docker_taxi-net

volumes:
  clickhouse-data:
  superset-data:

services:
  clickhouse:
    image: clickhouse/clickhouse-server:23.8
    platform: linux/amd64
    container_name: clickhouse
    hostname: clickhouse
    ports:
      - "8123:8123"
      - "9009:9009"
    ulimits:
      nofile: {soft: 262144, hard: 262144}
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ../data:/data
      - ./clickhouse/config.xml:/etc/clickhouse-server/config.d/custom.xml
      - ./clickhouse/users.xml:/etc/clickhouse-server/users.d/custom.xml
    networks:
      - taxi-net

  airflow:
    image: apache/airflow:2.7.3
    platform: linux/amd64
    container_name: airflow
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://taxi_user:taxi_pass123@postgres:5432/airflow
      - AIRFLOW__CORE__LOAD_EXAMPLES=false
      - AIRFLOW__CORE__FERNET_KEY=ZmDfcTF7_60GrrY167zsiPd67pEvs0aGOv2oasOM1Pg=
      - AIRFLOW__WEBSERVER__SECRET_KEY=nyc-taxi-secret
    ports:
      - "8081:8080"
    volumes:
      - ../airflow/dags:/opt/airflow/dags
      - ../jobs:/opt/airflow/jobs
    command: >
      bash -c "airflow db migrate &&
               (airflow users create --username admin --password admin --firstname A --lastname B --role Admin --email a@b.com || true) &&
               (airflow scheduler &) && airflow webserver"
    networks:
      - taxi-net

  superset:
    image: apache/superset:3.0.1
    platform: linux/amd64
    container_name: superset
    environment:
      - SUPERSET_SECRET_KEY=nyc-taxi-superset-secret-key-2024
    ports:
      - "8088:8088"
    volumes:
      - superset-data:/app/superset_home
    command: >
      bash -c "pip install clickhouse-connect &&
               superset db upgrade &&
               (superset fab create-admin --username admin --firstname A --lastname B --email a@b.com --password admin || true) &&
               superset init &&
               superset run -h 0.0.0.0 -p 8088"
    networks:
      - taxi-net

  streamlit:
    image: python:3.11-slim
    platform: linux/amd64
    container_name: streamlit
    ports:
      - "8501:8501"
    volumes:
      - ../streamlit:/app
    working_dir: /app
    command: >
      bash -c "pip install streamlit pandas psycopg2-binary &&
               streamlit run driver_app.py --server.address 0.0.0.0 --server.port 8501"
    networks:
      - taxi-net
